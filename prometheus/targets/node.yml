# De monitoring-VM is ook de load-generator. Zijn node_exporter (docker-compose.yml,
# host-netwerk, poort 9100) is vanuit de Prometheus-container bereikbaar via host.docker.internal.
# 'instance' wordt door scripts/setup-monitoring-vm.sh op de echte hostnaam gezet.
#
# Let op: het netwerkverkeer van deze VM omvat naast de benchmark ook scrapes en het
# Grafana/Loki-verkeer. Dat is klein vergeleken met een benchmark, maar meet de baseline even.
# De write-amplification-regel telt pas boven 1 MB/s TX.
#
# De storage-nodes (sue-poc-storage01-04) staan in storage-nodes.yml (label wisselt per fase).

- targets: ['host.docker.internal:9100']
  labels:
    system: loadgen
    instance: sue-poc-monitoring
